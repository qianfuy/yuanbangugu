name: Find identifiers
on: workflow_dispatch
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search identifiers
        run: |
          grep -rn "desgemini" . --include=*.swift --include=*.entitlements --include=*.plist --include=*.pbxproj --include=*.yml --include=*.sh | head -80
      - name: Show entitlements files
        run: |
          find . -name '*.entitlements' -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
