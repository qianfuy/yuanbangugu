name: Export source
on: workflow_dispatch
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect code files
        run: |
          find . -type f \( -name '*.swift' -o -name '*.m' -o -name '*.mm' -o -name '*.h' -o -name '*.plist' -o -name '*.entitlements' -o -name 'project.pbxproj' \) -not -path './.git/*' -not -path './Frameworks/*' -not -path './.tmp/*' -not -path './Resources/*' | zip -@ source-code.zip
          ls -la source-code.zip
      - uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: source-code.zip
