name: Build unsigned IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Show required frameworks
        run: |
          echo "=== Required by project ==="
          grep -rhoE '[A-Za-z0-9_.-]+\.xcframework' Hamster.xcodeproj Packages 2>/dev/null | sort -u | tee required.txt

      - name: Get frameworks from fulanto/LibrimeKit
        run: |
          gh release list -R fulanto/LibrimeKit -L 10
          TAG=$(gh release list -R fulanto/LibrimeKit -L 1 --json tagName -q '.[0].tagName')
          echo "Using release: $TAG"
          mkdir -p dl ex Frameworks
          gh release download "$TAG" -R fulanto/LibrimeKit -D dl
          echo "=== Downloaded assets ==="
          ls -la dl
          for f in dl/*.tgz dl/*.tar.gz; do [ -e "$f" ] && tar -zxf "$f" -C ex; done || true
          for f in dl/*.zip; do [ -e "$f" ] && unzip -oq "$f" -d ex; done || true
          find ex -name '*.xcframework' -prune -exec cp -R {} Frameworks/ \;
          echo "=== Available in Frameworks/ ==="
          ls Frameworks | tee available.txt
          echo "=== MISSING (required but not available) ==="
          comm -23 <(sort -u required.txt) <(sort -u available.txt) || true

      - name: Schemas
        run: make schema

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Hamster.xcodeproj -scheme Hamster

      - name: Archive (no signing)
        run: |
          xcodebuild archive \
            -project Hamster.xcodeproj -scheme Hamster \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Hamster.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Hamster.xcarchive/Products/Applications/*.app Payload/
          zip -qr Hamster.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Hamster-ipa
          path: Hamster.ipa
