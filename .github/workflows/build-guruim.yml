name: Build unsigned IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Download frameworks and schemas
        run: |
          make framework
          make schema

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Hamster.xcodeproj -scheme Hamster

      - name: Archive (no signing)
        run: |
          xcodebuild archive \
            -project Hamster.xcodeproj -scheme Hamster \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Hamster.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Hamster.xcarchive/Products/Applications/*.app Payload/
          zip -qr Hamster.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Hamster-ipa
          path: Hamster.ipa
