name: Build unsigned IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Get frameworks
        run: |
          if ls Frameworks/*.xcframework >/dev/null 2>&1; then
            echo "Frameworks already in repo, skip download"
          else
            echo "=== LibrimeKit releases and assets ==="
            gh api repos/imfuxiao/LibrimeKit/releases \
              --jq '.[] | "\(.tag_name): \([.assets[].name] | join(", "))"'
            for tag in $(gh release list -R imfuxiao/LibrimeKit -L 30 --json tagName -q '.[].tagName'); do
              if gh release download "$tag" -R imfuxiao/LibrimeKit -p 'Frameworks*.tgz' -D . 2>/dev/null; then
                echo "Downloaded from $tag"; break
              fi
            done
            ls Frameworks*.tgz
            tar -zxf Frameworks*.tgz
          fi
          ls Frameworks

      - name: Schemas
        run: make schema

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Hamster.xcodeproj -scheme Hamster

      - name: Archive (no signing)
        run: |
          xcodebuild archive \
            -project Hamster.xcodeproj -scheme Hamster \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Hamster.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Hamster.xcarchive/Products/Applications/*.app Payload/
          zip -qr Hamster.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Hamster-ipa
          path: Hamster.ipa
